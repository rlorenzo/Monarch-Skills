name: lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # scripts/lint skips manifest validation when the CLI is absent, so
      # install it to get the full check rather than only the local ones.
      # `claude plugin validate` reads manifests off disk and needs no auth.
      - run: npm install -g @anthropic-ai/claude-code
      - run: ./scripts/lint

  version-bump:
    # Marketplace installs compare plugin.json's version, so a skill change
    # without a bump never reaches plugin users.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-version-bump')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-version-bump "${{ github.event.pull_request.base.sha }}"
